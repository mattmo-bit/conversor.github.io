<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de monedas</title>
  <link rel="stylesheet" href=".//assets/css/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main class="container">
    <h1>Conversor de monedas Nacional</h1>
    <hr />
    <section class="card">
      <h2>Pesos CLP</h2>
      <input type="number" id="monto" placeholder="Ingrese el monto en CLP" />
      
      <label for="moneda">Moneda a convertir:</label>
      <select id="moneda">
        <option value="" disabled selected>Seleccione moneda</option>
        <option value="dolar">Dólar</option>
        <option value="euro">Euro</option>
        <option value="uf">UF</option>
      </select>

      <button id="btnBuscar">Buscar</button>
      
      <p id="resultado">...</p>
      <p id="error" class="error-msg"></p>
    </section>

    <section class="chart-container">
      <canvas id="graficoHistorial"></canvas>
    </section>
  </main>

  <script src=".//assets/js/index.js"></script>
</body>
</html>
